# ============================================
# BattleTreeRecognizer V3 配置
# 修改后需重新启动程序生效;建议用记事本编辑,保持 UTF-8 编码
# ============================================

[识别]
# 截图区域(游戏窗口全屏坐标,像素)
x1 = 676
y1 = 64
x2 = 1560
y2 = 137
# 遮罩区域(相对截图区域的水平像素区间,此段置黑;用于遮挡双打的"状态/Lv"文字)
mask_x1 = 300
mask_x2 = 540
# OCR 前四周扩边(像素)
border = 60
# 高阈值:提取纯白文字(深色/浅色背景均适用)
high_thresh = 245
# 低阈值:提取黑色描边(描边反色通道)
low_thresh = 60
# 模糊匹配相似度阈值(0~1,越小越宽松)
match_cutoff = 0.4
# 使用的预处理通道,逗号分隔,可选:
#   high    = 高阈值提取纯白文字
#   outline = 低阈值提取黑色描边并反色
#   clahe   = 灰度 CLAHE + 归一化
# 只填一个=只用该通道;留空=全部使用(默认)
channels = high,outline,clahe

[触发]
# 触发识别的手柄按键编号,逗号分隔(支持中文逗号)
buttons = 4,6,7,9,10

[数据]
# 数据库文件名(与 config.ini 同目录,须为 .xlsx)
db_file = BattleTreeNpcPokemonStats_CN_New_Calc.xlsx

[提示]
# 语音提示开关(true/false)
tts_enabled = true
# 语速(Windows SAPI 范围 -10~10,0=正常,正值更快)
tts_rate = 2
# TTS 输出设备(留空=系统默认输出)。可填设备名片段做包含匹配,例如:
#   CABLE Input   → 匹配 "CABLE Input (VB-Audio Virtual Cable)"
#   VB-Audio      → 同样命中上面那个设备
# 指定设备不存在或设置失败时,自动回退系统默认输出并打印提示。
tts_output_device =
# 需要提示的道具(逗号分隔,精确匹配)
alert_items = 气势披带,讲究围巾,先制之爪
# 需要提示的招式(逗号分隔,精确匹配)
alert_moves = 击掌奇袭,戏法空间,电磁波
# 需要提示的特性(逗号分隔,包含匹配;如"茂盛"会命中"茂盛／叶绿素")
alert_abilities = 避雷针,蓄电,引水,悠游自如
